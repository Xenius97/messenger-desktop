<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        h2 {
            margin: 0 0 25px 0;
            color: #00aaff;
            font-size: 18px;
            font-weight: normal;
        }
        .progress-container {
            width: 100%;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
            height: 30px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00aaff, #0088cc);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            position: absolute;
            top: 0;
            left: 0;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            text-align: center;
            z-index: 10;
            mix-blend-mode: screen;
        }
        .status {
            color: #888;
            font-size: 13px;
            text-align: center;
            margin-bottom: 10px;
        }
        .buttons {
            margin-top: 20px;
            display: none;
            gap: 10px;
        }
        .buttons.show {
            display: flex;
        }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00aaff;
            color: white;
        }
        .btn-primary:hover {
            background: #0099ee;
        }
        .btn-secondary {
            background: #333;
            color: #00aaff;
            border: 1px solid #00aaff;
        }
        .btn-secondary:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <h2>Update Downloading...</h2>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="status" id="status">Preparing download...</div>
    <div class="buttons" id="buttons">
        <button class="btn-primary" onclick="restartNow()">Restart Now</button>
        <button class="btn-secondary" onclick="restartLater()">Later</button>
    </div>
    <script>
        console.log('Update progress window loaded');
        
        const { ipcRenderer } = require('electron');
        console.log('IPC Renderer available:', !!ipcRenderer);
        
        // Fallback for formatBytes (also injected, but define here too)
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function restartNow() {
            console.log('Restarting app');
            ipcRenderer.send('restart-app');
        }
        
        function restartLater() {
            console.log('Closing update window');
            ipcRenderer.send('close-update-window');
        }
    </script>
</body>
</html>
